<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Doner Shaurma Since 1994 - Halal restoran menyusu">
  <title>Doner Shaurma - Since 1994</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1a1a1a; --bg2: #242424; --bgc: #2d2d2d; --bgch: #353535;
      --acc: #f5a623; --accd: #d4891a; --accl: #ffc15e;
      --t1: #ffffff; --t2: #b0b0b0; --tm: #757575;
      --border: #3a3a3a; --sh: 0 4px 20px rgba(0,0,0,.4);
      --sh2: 0 8px 32px rgba(245,166,35,.25); --r: 14px; --tr: .22s cubic-bezier(.4,0,.2,1);
    }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--t1); min-height: 100vh; overflow-x: hidden; line-height: 1.5; }
    img { display: block; max-width: 100%; height: auto; }
    button { cursor: pointer; border: none; background: none; font-family: inherit; }

    /* HEADER */
    .site-header { position: sticky; top: 0; z-index: 100; background: rgba(26,26,26,.97); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0 16px; }
    .header-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 12px; }
    .logo-wrap { display: flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink: 0; }
    .logo-img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid var(--acc); }
    .logo-text { display: flex; flex-direction: column; line-height: 1.2; }
    .logo-title { font-size: 15px; font-weight: 700; color: var(--acc); letter-spacing: .5px; }
    .logo-sub { font-size: 11px; color: var(--t2); letter-spacing: 1px; text-transform: uppercase; }

    /* CART BUTTON */
    .cart-btn { position: relative; background: var(--acc); color: #1a1a1a; border: none; border-radius: 24px; padding: 8px 16px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; transition: background var(--tr), transform var(--tr); flex-shrink: 0; }
    .cart-btn:hover { background: var(--accl); transform: scale(1.04); }
    .cart-btn:active { transform: scale(.98); }
    .cart-count { background: #1a1a1a; color: var(--acc); border-radius: 50%; width: 20px; height: 20px; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .cart-count.hidden { display: none; }

    /* CATEGORY NAV */
    .cat-nav-wrap { position: sticky; top: 64px; z-index: 90; background: var(--bg2); border-bottom: 1px solid var(--border); overflow: hidden; }
    .cat-nav { max-width: 1100px; margin: 0 auto; display: flex; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; padding: 0 8px; gap: 4px; }
    .cat-nav::-webkit-scrollbar { display: none; }
    .cat-btn { flex-shrink: 0; padding: 12px 18px; font-size: 13px; font-weight: 600; color: var(--t2); background: transparent; border-bottom: 3px solid transparent; transition: color var(--tr), border-color var(--tr); white-space: nowrap; letter-spacing: .3px; }
    .cat-btn:hover { color: var(--accl); }
    .cat-btn.active { color: var(--acc); border-bottom-color: var(--acc); }

    /* MAIN */
    .main-content { max-width: 1100px; margin: 0 auto; padding: 24px 16px 80px; }

    /* CATEGORY SECTIONS */
    .category-section { display: none; animation: fadeIn .28s ease; }
    .category-section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding-bottom: 14px; border-bottom: 2px solid var(--border); }
    .section-icon { font-size: 26px; line-height: 1; }
    .section-title { font-size: 22px; font-weight: 700; color: var(--t1); letter-spacing: .3px; }
    .section-count { margin-left: auto; font-size: 12px; color: var(--tm); background: var(--bgc); padding: 4px 10px; border-radius: 20px; }

    /* PRODUCT GRID */
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }

    /* PRODUCT CARD */
    .product-card { background: var(--bgc); border-radius: var(--r); overflow: hidden; border: 1px solid var(--border); transition: transform var(--tr), box-shadow var(--tr), border-color var(--tr); will-change: transform; position: relative; }
    .product-card:hover { transform: translateY(-3px); box-shadow: var(--sh2); border-color: rgba(245,166,35,.4); }
    .card-img-wrap { position: relative; width: 100%; padding-top: 62%; overflow: hidden; background: #222; }
    .card-img-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
    .product-card:hover .card-img-wrap img { transform: scale(1.05); }
    .card-body { padding: 12px 14px 14px; }
    .card-name { font-size: 14px; font-weight: 700; color: var(--t1); margin-bottom: 4px; line-height: 1.3; }
    .card-desc { font-size: 12px; color: var(--t2); line-height: 1.5; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .card-price { font-size: 16px; font-weight: 800; color: var(--acc); }
    .add-btn { background: var(--acc); color: #1a1a1a; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; transition: background var(--tr), transform var(--tr); flex-shrink: 0; line-height: 1; padding-bottom: 1px; }
    .add-btn:hover { background: var(--accl); transform: scale(1.12); }
    .add-btn:active { transform: scale(.95); }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.82); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility .25s ease; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .modal-overlay.open { opacity: 1; visibility: visible; }
    .modal-box { background: var(--bgc); border-radius: 20px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); transform: scale(.94) translateY(16px); transition: transform .28s cubic-bezier(.34,1.56,.64,1); scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .modal-box::-webkit-scrollbar { width: 4px; }
    .modal-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .modal-overlay.open .modal-box { transform: scale(1) translateY(0); }
    .modal-img-wrap { position: relative; width: 100%; padding-top: 60%; overflow: hidden; background: #222; border-radius: 20px 20px 0 0; }
    .modal-img-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .modal-img-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 72px; background: linear-gradient(135deg,#2a2a2a,#333); }
    .modal-close { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,.65); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; z-index: 10; transition: background var(--tr), transform var(--tr); }
    .modal-close:hover { background: rgba(0,0,0,.9); transform: scale(1.1); }
    .modal-body { padding: 20px 22px 24px; }
    .modal-cat-badge { display: inline-block; font-size: 11px; font-weight: 600; color: var(--acc); background: rgba(245,166,35,.12); border: 1px solid rgba(245,166,35,.3); padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; letter-spacing: .5px; text-transform: uppercase; }
    .modal-name { font-size: 22px; font-weight: 800; color: var(--t1); margin-bottom: 8px; line-height: 1.25; }
    .modal-desc { font-size: 14px; color: var(--t2); line-height: 1.65; margin-bottom: 16px; }
    .modal-divider { height: 1px; background: var(--border); margin: 14px 0; }
    .modal-price-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .modal-price-label { font-size: 11px; color: var(--tm); text-transform: uppercase; letter-spacing: 1px; }
    .modal-price { font-size: 28px; font-weight: 900; color: var(--acc); }
    .modal-add-btn { background: var(--acc); color: #1a1a1a; border: none; border-radius: 12px; padding: 12px 28px; font-size: 15px; font-weight: 700; width: 100%; transition: background var(--tr), transform var(--tr); }
    .modal-add-btn:hover { background: var(--accl); transform: scale(1.02); }

    /* CART DRAWER */
    .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 2000; opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility .25s ease; backdrop-filter: blur(3px); }
    .cart-overlay.open { opacity: 1; visibility: visible; }
    .cart-drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(420px, 100vw); background: var(--bgc); z-index: 2001; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .3s cubic-bezier(.4,0,.2,1); border-left: 1px solid var(--border); }
    .cart-overlay.open .cart-drawer { transform: translateX(0); }
    .cart-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .cart-title { font-size: 18px; font-weight: 700; color: var(--t1); }
    .cart-close-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--bg2); color: var(--t2); display: flex; align-items: center; justify-content: center; font-size: 18px; transition: background var(--tr), color var(--tr); }
    .cart-close-btn:hover { background: var(--border); color: var(--t1); }
    .cart-items { flex: 1; overflow-y: auto; padding: 16px 20px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .cart-items::-webkit-scrollbar { width: 4px; }
    .cart-items::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .cart-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 200px; gap: 12px; color: var(--tm); }
    .cart-empty-icon { font-size: 52px; }
    .cart-empty-text { font-size: 15px; }
    .cart-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .cart-item-img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: #222; }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-name { font-size: 13px; font-weight: 600; color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cart-item-price-unit { font-size: 12px; color: var(--tm); margin-top: 2px; }
    .cart-item-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .qty-btn { width: 28px; height: 28px; border-radius: 8px; background: var(--bg2); color: var(--t1); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; transition: background var(--tr); }
    .qty-btn:hover { background: var(--border); }
    .qty-btn.remove-btn { background: rgba(220,53,69,.15); color: #dc3545; }
    .qty-btn.remove-btn:hover { background: rgba(220,53,69,.3); }
    .qty-num { font-size: 14px; font-weight: 700; color: var(--t1); min-width: 20px; text-align: center; }
    .cart-item-total { font-size: 14px; font-weight: 700; color: var(--acc); min-width: 56px; text-align: right; flex-shrink: 0; }
    .cart-footer { padding: 16px 20px; border-top: 1px solid var(--border); flex-shrink: 0; }
    .cart-total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .cart-total-label { font-size: 15px; color: var(--t2); }
    .cart-total-price { font-size: 22px; font-weight: 900; color: var(--acc); }
    .checkout-btn { width: 100%; background: linear-gradient(135deg, #25d366, #128c7e); color: #fff; border: none; border-radius: 14px; padding: 14px 20px; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity var(--tr), transform var(--tr); }
    .checkout-btn:hover { opacity: .9; transform: scale(1.02); }
    .checkout-btn:active { transform: scale(.98); }
    .checkout-btn svg { width: 22px; height: 22px; flex-shrink: 0; }
    .cart-clear-btn { width: 100%; margin-top: 10px; background: transparent; color: var(--tm); border: 1px solid var(--border); border-radius: 10px; padding: 9px; font-size: 13px; transition: color var(--tr), border-color var(--tr); }
    .cart-clear-btn:hover { color: #dc3545; border-color: #dc3545; }

    /* TOAST */
    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); background: #333; color: #fff; padding: 10px 20px; border-radius: 24px; font-size: 13px; font-weight: 600; z-index: 3000; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; white-space: nowrap; border: 1px solid var(--border); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* SCROLL TOP */
    .scroll-top { position: fixed; bottom: 24px; right: 20px; width: 44px; height: 44px; border-radius: 50%; background: var(--acc); color: #1a1a1a; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; box-shadow: 0 4px 16px rgba(245,166,35,.4); z-index: 200; opacity: 0; visibility: hidden; transform: translateY(10px); transition: opacity .25s, visibility .25s, transform .25s; }
    .scroll-top.visible { opacity: 1; visibility: visible; transform: translateY(0); }
    .scroll-top:hover { background: var(--accl); }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .header-inner { height: 58px; }
      .cat-nav-wrap { top: 58px; }
      .logo-title { font-size: 13px; }
      .logo-img { width: 40px; height: 40px; }
      .section-title { font-size: 19px; }
      .product-grid { grid-template-columns: repeat(2,1fr); gap: 12px; }
      .modal-box { max-width: 98vw; }
      .modal-name { font-size: 19px; }
      .modal-price { font-size: 24px; }
    }
    @media (max-width: 480px) {
      .logo-text { display: none; }
      .product-grid { grid-template-columns: repeat(2,1fr); gap: 10px; }
      .card-body { padding: 9px 11px 11px; }
      .card-name { font-size: 12px; }
      .card-price { font-size: 14px; }
      .add-btn { width: 28px; height: 28px; font-size: 18px; }
      .cart-btn span { display: none; }
    }
    @media (max-width: 360px) { .product-grid { grid-template-columns: 1fr; } }
    @media (min-width: 640px) { .product-grid { grid-template-columns: repeat(2,1fr); } }
    @media (min-width: 900px) { .product-grid { grid-template-columns: repeat(3,1fr); } }
    @media (min-width: 1100px) { .product-grid { grid-template-columns: repeat(4,1fr); } }
  </style>
</head>

      {id:'donercorek-toyuq', cat:'doner', name:'Dönər çörək / lavaş (toyuq)', desc:'Toyuq əti, dönər salatı, istəyə görə mayonez, duz. Çörək və ya lavaşda servis edilir.', price:4},
      {id:'qamburger', cat:'doner', name:'Qamburger', desc:'Sosis (1 ədəd), mayonez, tomat, dönər salatı, duz, istiot. Yumuşaq bulkada servis edilir.', price:3.5},
      // İÇKİLƏR
      {id:'cola-03', cat:'drinks', name:'Coca-Cola 0.3L', desc:'Soyuq Coca-Cola, 300ml. Serinləşdirici klassik içki.', price:1.5},
      {id:'cola-05', cat:'drinks', name:'Coca-Cola 0.5L', desc:'Soyuq Coca-Cola, 500ml. Böyük ölçü, daha çox zövq.', price:2},
      {id:'cola-1', cat:'drinks', name:'Coca-Cola 1L', desc:'Soyuq Coca-Cola, 1 litr. Ailə ölçüsü, masa üçün ideal.', price:3.5},
      {id:'ayran', cat:'drinks', name:'Ayran', desc:'Elit Ayran — təzə, soyuq süd məhsulu. Dönər və şaurma ilə ən yaxşı seçim.', price:1}
    ];

    const CAT_NAMES = {sets:'Setlər', hot:'İsti Yeməklər', doner:'Dönər Şaurma', drinks:'İçkilər'};
    let cart = [];
    let modalProductId = null;

    /* ===== RENDER PRODUCTS ===== */
    function fmt(price) { return price % 1 === 0 ? price + ' AZN' : price.toFixed(1) + ' AZN'; }

    function buildCards() {
      const cats = ['sets','hot','doner','drinks'];
      cats.forEach(cat => {
        const items = PRODUCTS.filter(p => p.cat === cat);
        const grid = document.getElementById('grid-' + cat);
        const cnt = document.getElementById('cnt-' + cat);
        if (cnt) cnt.textContent = items.length + ' məhsul';
        grid.innerHTML = items.map(p => `
          <article class="product-card" onclick="openModal('${p.id}')">
            <div class="card-img-wrap">
              <img src="${PROD_IMG}" alt="${p.name}" loading="lazy">
            </div>
            <div class="card-body">
              <h3 class="card-name">${p.name}</h3>
              <p class="card-desc">${p.desc}</p>
              <div class="card-footer">
                <span class="card-price">${fmt(p.price)}</span>
                <button class="add-btn" onclick="addToCart(event,'${p.id}')" aria-label="Səbətə əlavə et">+</button>
              </div>
            </div>
          </article>`).join('');
      });
    }

    /* ===== CATEGORY SWITCHER ===== */
    function showCategory(catId) {
      document.querySelectorAll('.category-section').forEach(s => s.classList.remove('active'));
      const t = document.getElementById('cat-' + catId);
      if (t) t.classList.add('active');
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === catId));
      const ab = document.querySelector('.cat-btn.active');
      if (ab) ab.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
      window.scrollTo({top:0, behavior:'smooth'});
    }

    /* ===== MODAL ===== */
    function openModal(id) {
      const p = PRODUCTS.find(x => x.id === id);
      if (!p) return;
      modalProductId = id;
      const iw = document.getElementById('modalImgWrap');
      iw.innerHTML = '<button class="modal-close" onclick="closeModal()" aria-label="Bağla">✕</button>';
      const img = document.createElement('img');
      img.src = PROD_IMG;
      img.alt = p.name;
      img.loading = 'lazy';
      iw.appendChild(img);
      document.getElementById('modalCat').textContent = CAT_NAMES[p.cat] || p.cat;
      document.getElementById('modalName').textContent = p.name;
      document.getElementById('modalDesc').textContent = p.desc;
      document.getElementById('modalPrice').textContent = fmt(p.price);
      document.getElementById('modalOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
      document.body.style.overflow = '';
      modalProductId = null;
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById('modalOverlay')) closeModal();
    }

    function addFromModal() {
      if (!modalProductId) return;
      addToCartById(modalProductId);
      closeModal();
    }

    /* ===== CART ===== */
    function addToCart(e, id) {
      e.stopPropagation();
      addToCartById(id);
    }

    function addToCartById(id) {
      const p = PRODUCTS.find(x => x.id === id);
      if (!p) return;
      const ex = cart.find(c => c.id === id);
      if (ex) ex.qty++;
      else cart.push({id, qty: 1});
      updateCartUI();
      showToast('✓ ' + p.name + ' əlavə edildi');
    }

    function updateCartUI() {
      const total = cart.reduce((s, c) => s + c.qty, 0);
      const cc = document.getElementById('cartCount');
      cc.textContent = total;
      cc.classList.toggle('hidden', total === 0);
    }

    function renderCartItems() {
      const container = document.getElementById('cartItems');
      const footer = document.getElementById('cartFooter');
      if (cart.length === 0) {
        container.innerHTML = '<div class="cart-empty"><span class="cart-empty-icon">🛒</span><span class="cart-empty-text">Səbət boşdur</span></div>';
        footer.style.display = 'none';
        return;
      }
      footer.style.display = 'block';
      let totalPrice = 0;
      container.innerHTML = cart.map(c => {
        const p = PRODUCTS.find(x => x.id === c.id);
        if (!p) return '';
        const lineTotal = p.price * c.qty;
        totalPrice += lineTotal;
        return `<div class="cart-item">
          <img class="cart-item-img" src="${PROD_IMG}" alt="${p.name}">
          <div class="cart-item-info">
            <div class="cart-item-name">${p.name}</div>
            <div class="cart-item-price-unit">${fmt(p.price)} / ədəd</div>
          </div>
          <div class="cart-item-controls">
            <button class="qty-btn remove-btn" onclick="removeCartItem('${c.id}')" aria-label="Sil">🗑</button>
            <button class="qty-btn" onclick="changeQty('${c.id}',-1)" aria-label="Azalt">−</button>
            <span class="qty-num">${c.qty}</span>
            <button class="qty-btn" onclick="changeQty('${c.id}',1)" aria-label="Artır">+</button>
          </div>
          <span class="cart-item-total">${fmt(lineTotal)}</span>
        </div>`;
      }).join('');
      document.getElementById('cartTotal').textContent = fmt(totalPrice);
    }

    function changeQty(id, delta) {
      const item = cart.find(c => c.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) cart = cart.filter(c => c.id !== id);
      updateCartUI();
      renderCartItems();
    }

    function removeCartItem(id) {
      cart = cart.filter(c => c.id !== id);
      updateCartUI();
      renderCartItems();
    }

    function clearCart() {
      cart = [];
      updateCartUI();
      renderCartItems();
    }

    function openCart() {
      renderCartItems();
      document.getElementById('cartOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeCart() {
      document.getElementById('cartOverlay').classList.remove('open');
      document.body.style.overflow = '';
    }

    function handleCartOverlayClick(e) {
      if (e.target === document.getElementById('cartOverlay')) closeCart();
    }

    function sendToWhatsApp() {
      if (cart.length === 0) { showToast('Səbət boşdur!'); return; }
      let msg = '🍽️ *DONER SHAURMA SİFARİŞ*\n';
      msg += '━━━━━━━━━━━━━━━━━━━━\n';
      let total = 0;
      cart.forEach(c => {
        const p = PRODUCTS.find(x => x.id === c.id);
        if (!p) return;
        const line = p.price * c.qty;
        total += line;
        msg += `▪️ ${p.name}\n   ${c.qty} ədəd × ${fmt(p.price)} = *${fmt(line)}*\n`;
      });
      msg += '━━━━━━━━━━━━━━━━━━━━\n';
      msg += `💰 *CƏMİ: ${fmt(total)}*\n`;
      msg += '━━━━━━━━━━━━━━━━━━━━\n';
      msg += '📍 Ünvan / Çatdırılma məlumatlarınızı göndərin.';
      const phone = '994559406018';
      const url = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(msg);
      window.open(url, '_blank');
    }

    /* ===== TOAST ===== */
    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
    }

    /* ===== KEYBOARD ===== */
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') { closeModal(); closeCart(); }
    });

    /* ===== SCROLL TOP ===== */
    const stBtn = document.getElementById('scrollTop');
    window.addEventListener('scroll', function() {
      stBtn.classList.toggle('visible', window.scrollY > 300);
    }, {passive: true});

    /* ===== INIT ===== */
    buildCards();
  </script>
</body>
</html>
